<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Creative Agent Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF4E6;          /* 따뜻한 크림색 배경 */
    --bg-2: #FFE8CC;        /* 그라데이션용 살구색 */
    --card: #FFFBF5;        /* 카드 배경 */
    --text: #3B2A20;        /* 진한 브라운 (높은 가독성) */
    --text-soft: #6B5445;   /* 보조 텍스트 */
    --accent: #D9663B;      /* 테라코타 포인트 */
    --accent-soft: #FBD9C3;
    --border: #F0D5BA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Noto Sans KR', 'Pretendard', 'Malgun Gothic', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }
  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 8px 16px;
  }
  .logo {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 28px;
    box-shadow: 0 4px 12px rgba(217, 102, 59, .35);
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 2px 0 0;
    font-size: 1rem;
    color: var(--text-soft);
  }
  .chat-card {
    flex: 1;
    width: 100%;
    max-width: 960px;
    min-height: 0;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(120, 70, 30, .15);
    overflow: hidden;
    padding: 6px;
  }
  .chat-card iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 18px;
    background: #fff;
  }
  footer {
    margin-top: 12px;
    font-size: .9rem;
    color: var(--text-soft);
  }
  @media (max-width: 600px) {
    body { padding: 12px 8px; font-size: 17px; }
    header h1 { font-size: 1.25rem; }
    .chat-card { border-radius: 18px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">✨</div>
    <div>
      <h1>AI Creative Agent Team</h1>
      <p>궁금한 것을 편하게 물어보세요</p>
    </div>
  </header>

  <main class="chat-card">
    <iframe
      title="AI Creative Agent Team 챗봇"
      src="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_5MmQ2H/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
      frameborder="0">
    </iframe>
  </main>

  <footer>Powered by Microsoft Copilot Studio</footer>
</body>
</html>
